<title>예진미디어 영상편집</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root { --bg:#000000; --surface:#181b14; --fg:#f4efe4; --muted:#b2ab9c; --accent:#d6ff3e; --ink:#14160c; --line:#2e3326; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin:0; color:var(--fg); font-family:Pretendard,"Apple SD Gothic Neo",sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased; background:#000; }
  /* body::before removed for solid black background */
  header, main, footer { position:relative; z-index:1; }
  a { color:inherit; text-decoration:none; }
  img { max-width:100%; display:block; }
  .wrap { width:min(1120px, calc(100% - 40px)); margin:0 auto; }
  header { position:sticky; top:0; z-index:20; background:rgba(16,17,14,.82); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
  .nav { display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo small { display:block; color:var(--muted); font-size:11px; letter-spacing:.08em; }
  nav a { color:var(--muted); margin-left:22px; font-size:14px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; height:44px; padding:0 18px; border-radius:999px; background:var(--accent); color:var(--ink); font-weight:800; border:0; font:inherit; cursor:pointer; }
  .ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  h1 { font-size:clamp(40px,6vw,72px); line-height:.98; letter-spacing:-.04em; margin:14px 0 16px; }
  h2 { font-size:clamp(28px,4vw,40px); letter-spacing:-.04em; margin:0 0 8px; }
  h1,h2,h3 { text-wrap:balance; }
  .muted { color:var(--muted); }
  .kicker { color:var(--accent); font-size:13px; font-weight:800; letter-spacing:.14em; }
  section { padding:56px 0; }
  .hero { padding-top:64px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .card { background:rgba(16,18,12,.72); border:1px solid var(--line); border-radius:18px; padding:20px; }
  .tag { display:inline-block; background:var(--accent); color:var(--ink); border-radius:999px; font-size:12px; font-weight:800; padding:2px 8px; }
  .step { border-top:2px solid var(--accent); padding-top:12px; }
  figure { margin:36px 0 0; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--surface); }
  .samples { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; margin-top:28px; }
  .short { width:min(360px,100%); aspect-ratio:9/16; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:#000; }
  .wide { flex:1; min-width:min(100%,420px); aspect-ratio:16/9; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:#000; }
  .short iframe, .wide iframe { width:100%; height:100%; border:0; }
  figcaption { padding:18px 20px 22px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input, select, textarea { width:100%; background:#10120c; color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:12px; font:inherit; }
  textarea { min-height:110px; }
  .full { grid-column:1 / -1; }
  .days { font-size:32px; font-weight:800; color:var(--accent); margin:4px 0 0; }
  .past { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:22px; }
  .past figure { margin:0; }
  .past img { width:100%; aspect-ratio:16/9; object-fit:contain; background:#0c0d0a; }
  .past figcaption { padding:12px 14px; font-weight:700; }
  footer { border-top:1px solid var(--line); padding:28px 0 40px; color:var(--muted); font-size:13px; }
  button { cursor:pointer; }
  @media (max-width:800px) {
    nav a { display:none; }
    .grid2,.grid3,.grid4,.past { grid-template-columns:1fr; }
  }
</style>
</head>

          <p class="muted" id="t-career" style="margin:0">한국인의 밥상, TV는 사랑을 싣고, 6시 내고향, KBS다큐온, KBS다큐공감, 극한직업, 세계테마기행, 다큐프라임 등 방송 경력으로 최선을 다하겠습니다.</p>
